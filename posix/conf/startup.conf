# POSIX 样例配置：make install 会装到 /usr/local/conf/startup.conf
# （即 /usr/local/bin/bootlauncher 的 <exe 目录>/../conf 默认位置）
#
# [name]      starts an application entry (name must be unique)
# cmd = ...   command line, executed through /bin/sh -c
# deps = a,b  applications that must be started before this one
# wait = ms   pause after starting this app, before starting dependents

[logging]
cmd = /usr/local/bin/logsvc --dir /var/log/mysvc
wait = 500

[database]
cmd = /usr/local/bin/dbsvc --datadir /var/lib/mysvc
deps = logging
wait = 1000

[appserver]
cmd = /usr/local/bin/appsvc
deps = database, logging
