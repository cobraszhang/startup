# scripts.conf - interpreter-resolution tests for the browse feature
# the config stores only quoted script paths; launchers are prepended
# at execution time (cmd /c for .bat, powershell -File for .ps1,
# shell association for other registered types; unregistered fail)

[batapp]
cmd = "D:\My\DEV\startup\win32\test\wait.bat"

[psapp]
cmd = "D:\My\DEV\startup\win32\test\wait.ps1"

[unknownapp]
cmd = "D:\My\DEV\startup\win32\test\notype.zzz"
wait = 50
