# test/order.conf - scrambled on purpose: the launcher must still
# start first -> second -> third (each appends its name to order.txt).
[third]
cmd = cmd.exe /c echo third >> D:\My\DEV\startup\build\order.txt
deps = second

[first]
cmd = cmd.exe /c echo first >> D:\My\DEV\startup\build\order.txt
wait = 400

[second]
cmd = cmd.exe /c echo second >> D:\My\DEV\startup\build\order.txt
deps = first
wait = 400
