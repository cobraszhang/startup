# startup.conf - application startup configuration
# default location: <exe dir>\..\conf\startup.conf
#   dev builds (win32\build\*) read win32\conf\startup.conf
#   installed dist  reads dist\conf\startup.conf (the live config)
# [name] entry; cmd = command line; deps = comma separated prerequisites;
# wait = ms after start. A quoted lone script path runs with its
# interpreter resolved at execution time (see README).

[example-console]
cmd = "C:\Windows\System32\cmd.exe" /c echo hello from startup >nul

[example-script]
cmd = "D:\scripts\run.bat"
deps = example-console
wait = 200
