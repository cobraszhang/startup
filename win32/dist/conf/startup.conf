# conf/startup.conf (Windows sample)
# 默认配置位置 = <可执行文件目录>\..\conf\startup.conf
# 例如 build\startup-gcc.exe 读取 startup\conf\startup.conf
#
# [name]      starts an application entry (name must be unique)
# cmd = ...   command line to launch (CreateProcess)
# deps = a,b  applications that must be started before this one
# wait = ms   pause after starting this app, before starting dependents

[logging]
cmd = C:\tools\logsvc.exe --dir D:\logs
wait = 500

[database]
cmd = C:\tools\db.exe --data D:\data
deps = logging
wait = 1000

[appserver]
cmd = C:\tools\appserver.exe
deps = database, logging
